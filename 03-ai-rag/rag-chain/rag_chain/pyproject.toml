[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rag_chain"
version = "0.2.0"
description = "A modular package integrating database operations, OpenAI embeddings, and Google Cloud Platform (GCP) Secret Manager."
authors = [{name = "Felix", email = "exefncs2@gmail.com"}]
license = {text = "MIT"}
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "openai>=1.55.0",
    "python-dotenv>=1.2.2",
    "psycopg2-binary>=2.9.10",
    "sqlalchemy>=2.0.36",
    "google-cloud-secret-manager>=2.21.0",
    "uvicorn>=0.34.0",
    "fastapi>=0.115.12",
]

[project.scripts]
rag_chain = "rag_chain:main"
